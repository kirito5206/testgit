name: VoxCPM2 dataset tests
on:
  pull_request:
    paths:
      - "voice_dataset/**"
      - "tests/test_voxcpm2_dataset.py"
      - "requirements-voxcpm-data.txt"
      - ".github/workflows/voxcpm-dataset-tests.yml"
  workflow_dispatch:

jobs:
  synthetic-dataset-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only dataset dependencies
        run: python -m pip install numpy imageio-ffmpeg
      - name: Run synthetic audio and manifest unit tests
        run: python -m unittest discover -s tests -p "test_voxcpm2_dataset.py" -v
